<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>الصفحة غير موجودة - الموسوعة القرآنية</title>

        <!-- Fonts -->
        
        <link rel="stylesheet" href="/assets/fonts/ui/noto-kufi.css?v=1">

        <!-- Styles -->
        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }

            html, body {
                margin: 0;
                padding: 0;
                min-height: 100vh;
            }

            body {
                font-family: 'Noto Kufi Arabic', sans-serif;
                background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 50%, #f0f9ff 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 2rem;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background: linear-gradient(135deg, #0a1a1a 0%, #0c1520 50%, #0a1018 100%);
                    color: #e2e8f0;
                }
            }

            .error-container {
                text-align: center;
                max-width: 480px;
            }

            .error-icon {
                width: 120px;
                height: 120px;
                margin: 0 auto 2rem;
                background: linear-gradient(135deg, #007c89 0%, #0891b2 100%);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 20px 40px -10px rgba(0, 124, 137, 0.3);
            }

            .error-icon svg {
                width: 60px;
                height: 60px;
                color: white;
            }

            .error-code {
                font-size: 6rem;
                font-weight: 700;
                background: linear-gradient(135deg, #007c89, #0891b2);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                line-height: 1;
                margin-bottom: 1rem;
            }

            .error-title {
                font-size: 1.5rem;
                font-weight: 600;
                color: #1e293b;
                margin-bottom: 0.75rem;
            }

            @media (prefers-color-scheme: dark) {
                .error-title {
                    color: #e2e8f0;
                }
            }

            .error-message {
                font-size: 1rem;
                color: #64748b;
                margin-bottom: 2rem;
                line-height: 1.7;
            }

            @media (prefers-color-scheme: dark) {
                .error-message {
                    color: #94a3b8;
                }
            }

            .error-actions {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.875rem 1.5rem;
                border-radius: 0.75rem;
                font-size: 0.9375rem;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.2s ease;
            }

            .btn-primary {
                background: linear-gradient(135deg, #007c89 0%, #0891b2 100%);
                color: white;
                box-shadow: 0 4px 12px -2px rgba(0, 124, 137, 0.4);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px -4px rgba(0, 124, 137, 0.5);
            }

            .btn-secondary {
                background: white;
                color: #475569;
                border: 1px solid #e2e8f0;
                box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.08);
            }

            .btn-secondary:hover {
                background: #f8fafc;
                border-color: #cbd5e1;
            }

            @media (prefers-color-scheme: dark) {
                .btn-secondary {
                    background: #1e293b;
                    color: #cbd5e1;
                    border-color: #334155;
                    box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.3);
                }

                .btn-secondary:hover {
                    background: #334155;
                    border-color: #475569;
                }
            }

            .btn svg {
                width: 1.25rem;
                height: 1.25rem;
            }

            .error-extra {
                margin-top: 2.5rem;
                width: 100%;
            }

            .search-form {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 1.5rem;
            }

            .search-form input {
                flex: 1;
                padding: 0.875rem 1.25rem;
                border-radius: 0.75rem;
                border: 1px solid #e2e8f0;
                font-family: inherit;
                font-size: 0.9375rem;
                color: #1e293b;
                background: white;
            }

            .search-form input:focus {
                outline: 2px solid #007c89;
                outline-offset: 1px;
                border-color: #007c89;
            }

            @media (prefers-color-scheme: dark) {
                .search-form input {
                    background: #1e293b;
                    border-color: #334155;
                    color: #e2e8f0;
                }
            }

            .popular-links {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                justify-content: center;
            }

            .popular-links a {
                font-size: 0.8125rem;
                color: #007c89;
                text-decoration: none;
                background: rgba(0, 124, 137, 0.08);
                padding: 0.375rem 0.875rem;
                border-radius: 999px;
            }

            .popular-links a:hover {
                background: rgba(0, 124, 137, 0.16);
            }

            @media (prefers-color-scheme: dark) {
                .popular-links a {
                    color: #67e8f9;
                    background: rgba(103, 232, 249, 0.1);
                }
            }

            .logo {
                position: absolute;
                top: 2rem;
                right: 2rem;
            }

            .logo img {
                height: 40px;
                width: auto;
            }

            @media (max-width: 640px) {
                .error-code {
                    font-size: 4rem;
                }

                .error-icon {
                    width: 100px;
                    height: 100px;
                }

                .error-icon svg {
                    width: 50px;
                    height: 50px;
                }

                .logo {
                    position: static;
                    margin-bottom: 2rem;
                }
            }
        </style>
    </head>
    <body>
        <a href="/" class="logo">
            <img src="/assets/images/branding/logo.svg" alt="الموسوعة القرآنية">
        </a>

        <div class="error-container">
            <div class="error-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
    </svg>
                            </div>

            <div class="error-code">404</div>

            <h1 class="error-title">الصفحة غير موجودة</h1>

            <p class="error-message">
                عذراً، الصفحة التي تبحث عنها غير موجودة. ربما تم نقلها أو حذفها، أو أن الرابط الذي اتبعته غير صحيح. جرِّب البحث في الموسوعة:                            </p>

            <div class="error-actions">
                <a href="/" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z" clip-rule="evenodd" />
                    </svg>
                    الصفحة الرئيسية
                </a>

                <button onclick="history.back()" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z" clip-rule="evenodd" />
                    </svg>
                    العودة للخلف
                </button>
            </div>

                            <div class="error-extra">
                        <form action="/search" method="get" class="search-form" role="search">
        <input type="search" name="query" placeholder="ابحث عن آية، تفسير، كتاب، فتوى..." aria-label="بحث في الموسوعة" required>
        <button type="submit" class="btn btn-primary">بحث</button>
    </form>

    <div class="popular-links">
        <a href="/surah/1/1">قراءة القرآن</a>
        <a href="/tafsirs-books">كتب التفسير</a>
        <a href="/surah-info">معلومات السور</a>
        <a href="/topics">الموضوعات</a>
        <a href="/books">المكتبة</a>
        <a href="/fatwas">الفتاوى</a>
        <a href="/listen">الاستماع</a>
        <a href="/quran-qa">سؤال وجواب</a>
    </div>
                </div>
                    </div>
    </body>
</html>
