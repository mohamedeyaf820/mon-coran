<!doctype html>
<html lang="fr" dir="ltr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- Content Security Policy -->
        <meta
            http-equiv="Content-Security-Policy"
            content="__CSP_POLICY__"
        />
        <title>MushafPlus - Le Saint Coran</title>
        <meta name="description" content="MushafPlus — Lisez, écoutez et mémorisez le Saint Coran. Riwaya Hafs et Warsh, traductions en français, anglais et arabe, Tajwid, mode page Mushaf." />
        <!-- Open Graph -->
        <meta property="og:title" content="MushafPlus — Le Saint Coran" />
        <meta property="og:description" content="Application Coran complète : lecture, écoute, mémorisation, Tajwid, Riwaya Hafs &amp; Warsh, traductions multilingues." />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="/logo.png" />
        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="MushafPlus — Le Saint Coran" />
        <meta name="twitter:description" content="Lisez et mémorisez le Coran avec Tajwid, traductions et audio. Hafs &amp; Warsh." />
        <!-- Preconnect : domaines critiques au premier chargement uniquement -->
        <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://cdn.islamic.network" crossorigin />
        <link rel="preconnect" href="https://audio.qurancdn.com" crossorigin />
        <link rel="preconnect" href="https://api.alquran.cloud" crossorigin />
        <link rel="preconnect" href="https://api.quran.com" crossorigin />
        <!-- DNS prefetch : domaines secondaires (chargés à la demande) -->
        <link rel="dns-prefetch" href="https://verses.quran.foundation" />
        <link rel="dns-prefetch" href="https://fonts.quranwbw.com" />
        <link rel="dns-prefetch" href="https://everyayah.com" />
        <link rel="dns-prefetch" href="https://raw.githubusercontent.com" />
        <link rel="dns-prefetch" href="https://static.qurancdn.com" />
        <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
        <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
        <!-- Google Fonts : polices UI critiques -->
        <link
            href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap"
            rel="stylesheet"
        />

        <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />
        <!-- Preload critical Quran fonts for faster first render -->
        <link rel="preload" as="font" type="font/woff2" href="/fonts/sura_names.woff2" crossorigin />
        <!-- Note: This font is loaded dynamically by the app. The preload warning in console is expected and harmless. -->
        <link rel="preload" as="font" type="font/woff2" href="/fonts/scheherazade-new-400.woff2" crossorigin />
        <!-- Keep Quran fonts lazy via @font-face to avoid a heavy blocking OTF preload on mobile -->
        <link rel="icon" href="/logo.png" type="image/png" />
        <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#0D5C4A" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="MushafPlus" />
        <link rel="apple-touch-icon" href="/logo.png" />
    </head>

    <body>
        <div id="root"></div>
        <script>
            if (window.location.protocol === "file:") {
                document.body.innerHTML =
                    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fefaf3;color:#17352b;text-align:center">' +
                    '<div style="max-width:560px"><h1 style="margin:0 0 12px;font-size:26px">MushafPlus doit être lancé avec Vite</h1>' +
                    '<p style="margin:0 0 18px;line-height:1.6;color:#52635b">Cette application React ne peut pas s’ouvrir directement depuis <code>index.html</code>. Lance le serveur local puis ouvre l’URL localhost.</p>' +
                    '<code style="display:inline-block;padding:10px 14px;border-radius:8px;background:#e9efe9;color:#0f3d2e">npm run dev</code></div></div>';
            }
        </script>
        <script src="/boot-recovery.js"></script>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
